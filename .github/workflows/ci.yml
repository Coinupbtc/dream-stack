name: ci
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Orient path (no GPU)
        run: |
          bash -n setup.sh
          for f in scripts/*.sh; do bash -n "$f"; done
          python3 -m py_compile dream-baton.py
          test -f env.example
          ./setup.sh
          test -f .env
          ! grep -n '/home/coinupbtc' README.md FEEL_PASS.md setup.sh env.example
